<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Misiones del Robotito · Samuel Digital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: franja de marca arriba; pantallas inicio → mapa de misiones → misión (tablero a la izquierda, bloques a la derecha).
   Identidad Samuel Digital: atardecer ochentoso, cielo celeste, Bungee para la marca y Baloo 2 para todo lo demás.
   Diseño de un solo tema (el mismo del resto de los juegos), con todos los colores explícitos. */
:root{
  --noche:#1b1446; --violeta:#5b2a86; --magenta:#e0457b; --naranja:#ff8a3d; --sol:#ffc93c;
  --cielo:#7ec8f0; --panel:#ffffff; --tinta:#23364a; --suave:#4d6175; --linea:#dbe6ef; --sombra:#3d86b3;
  --ok:#2fae5d; --mal:#e4572e;
  /* colores de bloques, como en Scratch */
  --b-mov:#4c97ff; --b-acc:#9966ff; --b-ctrl:#ffab19; --b-ev:#ffbf00; --b-pr:#ff6680;
  --marca:"Bungee","Arial Black",system-ui,sans-serif;
  --display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --texto:"Nunito",system-ui,sans-serif;
  --g:#3fa7f5;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--cielo);color:var(--tinta);font-family:var(--texto);font-size:17px;line-height:1.45;user-select:none;-webkit-user-select:none}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font-family:var(--display);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--noche);outline-offset:2px}

/* Franja de marca */
.top{background:linear-gradient(180deg,var(--noche) 0%,var(--violeta) 55%,var(--magenta) 100%);color:#fff;border-bottom:6px solid var(--naranja);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.marca{font-family:var(--marca);font-size:clamp(17px,3vw,22px);letter-spacing:.5px;text-shadow:2px 2px 0 var(--magenta)}
.marca small{font-family:var(--display);font-size:.8em;color:#ffe7c2;text-shadow:none;margin-left:8px;letter-spacing:0;font-weight:800}
.marca-fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.volver-grado{background:#fff;color:var(--tinta);text-decoration:none;font-family:var(--display);font-weight:800;border-radius:999px;padding:3px 12px;font-size:15px}
.grado-fijo{display:inline-flex;align-items:center;gap:8px;background:var(--g);color:#fff;font-family:var(--display);font-weight:800;font-size:1.3rem;border-radius:16px;padding:6px 16px;align-self:flex-start}
.grado-fijo span{font-size:.95rem;opacity:.9}
.quien{display:flex;gap:8px;align-items:center;font-family:var(--display);font-weight:800}
.quien .chip{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 12px}
.quien button{border:none;background:#fff;color:var(--tinta);border-radius:999px;padding:3px 12px;font-weight:800;font-size:15px}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.card{background:var(--panel);border-radius:22px;box-shadow:0 5px 0 var(--sombra)}
.btn{border:none;border-radius:999px;font-weight:800;font-size:19px;padding:9px 22px;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ok{background:var(--ok);color:#fff}
.btn-sol{background:var(--sol);color:#5c3c00}
.btn-blanco{background:#fff;color:var(--tinta);box-shadow:0 4px 0 var(--linea)}
.btn-mal{background:var(--mal);color:#fff}

/* Inicio */
.inicio{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:center;padding:28px}
.inicio .robo-grande{display:flex;justify-content:center}
.inicio .robo-grande svg{width:min(260px,60vw);height:auto;animation:flota 3s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-10px)}}
.inicio h1{font-size:clamp(2rem,5vw,3rem);color:var(--violeta)}
.inicio p.lead{font-size:1.15rem;color:var(--suave);margin:.4em 0 1.2em}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.campo label,.campo .lbl{font-family:var(--display);font-weight:800;font-size:1.2rem}
.campo input{font-family:var(--display);font-size:1.4rem;font-weight:700;padding:8px 16px;border-radius:14px;border:3px solid var(--linea);max-width:340px;width:100%;color:var(--tinta);background:#fff;-webkit-text-fill-color:var(--tinta);caret-color:var(--tinta)}
.campo input::placeholder{color:#9aaab8;-webkit-text-fill-color:#9aaab8}
.campo input:focus{border-color:var(--g)}
.grados{display:flex;gap:10px;flex-wrap:wrap}
.grados button{border:3px solid var(--linea);background:#fff;border-radius:16px;padding:8px 16px;font-size:1.15rem;font-weight:800;color:var(--tinta);display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:110px}
.grados button b{font-size:1.7rem}
.grados button span{font-size:.85rem;color:var(--suave)}
.grados button.on{border-color:var(--gc);background:var(--gc);color:#fff}
.grados button.on span{color:#fff}

/* Mapa de misiones */
.mapa-cab{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.mapa-cab h2{font-size:clamp(1.7rem,4.5vw,2.4rem);color:#fff;text-shadow:0 3px 0 var(--sombra)}
.mapa-cab p{margin:0;color:#fff;font-weight:800;text-shadow:0 2px 0 var(--sombra);font-size:1.1rem}
.total{background:#fff;border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:800;font-size:1.2rem;box-shadow:0 4px 0 var(--sombra);font-variant-numeric:tabular-nums}
.misiones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.mi{position:relative;border:none;text-align:left;background:#fff;border-radius:22px;padding:16px 18px 14px;box-shadow:0 5px 0 var(--sombra);display:flex;flex-direction:column;gap:4px;color:var(--tinta);transition:transform .12s;min-height:140px}
.mi:hover:not(:disabled){transform:translateY(-3px)}
.mi .n{width:44px;height:44px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:800}
.mi h3{font-size:1.15rem;margin-top:4px}
.mi .est{font-size:1.4rem;letter-spacing:2px;margin-top:auto}
.mi .est i{font-style:normal;filter:grayscale(1);opacity:.3}
.mi:disabled{opacity:.6;cursor:not-allowed}
.mi:disabled .n{background:#b9c6d2}
.mi .candado{position:absolute;top:14px;right:16px;font-size:1.4rem}
.mi.hecha{outline:4px solid var(--ok)}
.mapa-pie{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}

/* Pantalla de misión */
.mision{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
.lado{min-width:0;display:flex;flex-direction:column;gap:14px}
.consigna{padding:16px 18px;border-top:10px solid var(--g)}
.consigna .eti{display:inline-block;background:var(--g);color:#fff;border-radius:999px;padding:1px 12px;font-weight:800;font-size:.9rem;margin-bottom:6px}
.consigna h2{font-size:1.7rem}
.consigna p{margin:.35em 0 0;font-size:1.08rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{background:#eef6fb;color:var(--sombra);border-radius:999px;padding:1px 10px;font-weight:800;font-size:.88rem}
.chips span.azar{background:#fff1d6;color:#8a5a00}

.escena{padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.globo{align-self:stretch;display:flex;gap:10px;align-items:center}
.globo .cara{width:46px;flex:none}
.globo .txt{flex:1;background:#eef6fb;border-radius:16px;padding:8px 14px;font-weight:800;position:relative;min-height:44px;display:flex;align-items:center}
.globo .txt::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:10px solid #eef6fb;border-left:0}
.globo.mal .txt{background:#fde3dc}.globo.mal .txt::before{border-right-color:#fde3dc}
.globo.bien .txt{background:#dcf5e5}.globo.bien .txt::before{border-right-color:#dcf5e5}
.tablero-wrap{width:100%;display:flex;justify-content:center}
.tablero{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px #5a8f3c}
.celda{position:absolute;background:#9fd96b}
.celda.osc{background:#93cf5f}
.item{position:absolute;display:grid;place-items:center;transition:transform .35s,opacity .35s}
.item svg{width:78%;height:78%}
.item.juntada{transform:scale(1.8) translateY(-20%);opacity:0}
.robot{position:absolute;left:0;top:0;transition:transform .32s ease-in-out;z-index:2;display:grid;place-items:center}
.robot svg{width:100%;height:100%;overflow:visible}
.robot.rapido{transition-duration:.12s}
.robot.choca svg{animation:sacude .4s}
@keyframes sacude{20%{transform:translateX(-8%) rotate(-8deg)}40%{transform:translateX(8%) rotate(8deg)}60%{transform:translateX(-6%) rotate(-5deg)}80%{transform:translateX(5%)}}
.pum{position:absolute;z-index:3;font-size:30px;pointer-events:none;animation:pum .6s forwards}
@keyframes pum{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.controles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.controles .btn{font-size:21px}

/* Área de bloques */
.taller{display:grid;grid-template-columns:236px minmax(0,1fr);overflow:hidden;min-height:440px}
.paleta{background:#f1f4f9;padding:12px;display:flex;flex-direction:column;gap:8px;border-right:3px solid var(--linea);transition:background .15s}
.paleta h3,.zona-cab h3{font-size:1.05rem;color:var(--suave)}
.paleta.borrar{background:#fde3dc}
.paleta .tacho{display:none;text-align:center;font-weight:800;color:var(--mal);padding:6px;border:3px dashed var(--mal);border-radius:12px}
.paleta.borrar .tacho{display:block}
.zona{padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.zona-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cuenta{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;background:#eef6fb;border-radius:999px;padding:1px 12px}
.cuenta.pasado{background:#fde3dc;color:var(--mal)}
.borrar-todo{border:none;background:transparent;color:var(--suave);font-weight:800;font-size:15px;padding:4px 8px;border-radius:8px}
.borrar-todo:hover{background:#f1f4f9}
.programa{flex:1;overflow:auto;padding:4px 4px 30px;min-height:300px}
.vacio-ayuda{color:var(--suave);font-weight:800;font-size:.95rem;margin:8px 0 0 4px}

.hat{display:inline-flex;align-items:center;gap:6px;background:var(--b-ev);color:#5c3c00;font-family:var(--display);font-weight:800;padding:12px 16px 8px;border-radius:22px 22px 8px 8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);font-size:16px}
.lista{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:12px}
#raiz{min-height:200px;padding-bottom:40px}
.bl{touch-action:none;cursor:grab;font-family:var(--display);font-weight:800;font-size:16px;color:#fff;border-radius:9px;max-width:100%}
.bl.simple{padding:7px 14px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);white-space:nowrap}
.bl.mov{background:var(--b-mov)} .bl.acc{background:var(--b-acc)} .bl.pr{background:var(--b-pr)}
.hat.def{background:var(--b-pr);color:#fff;margin-top:22px}
.hat.def b{background:#fff;color:#a8204a;border-radius:999px;padding:0 10px}
.select-blanco{background:#fff;color:var(--tinta)}
.bl .fl{display:inline-block;width:1.3em;text-align:center;font-size:1.15em}
.bl.c{background:transparent;display:flex;flex-direction:column;align-items:stretch;min-width:190px}
.bl.c>.cab,.bl.c>.medio,.bl.c>.pie{background:var(--b-ctrl);color:#4a2c00}
.bl.c>.cab{padding:7px 12px;border-radius:9px 9px 9px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bl.c>.medio{padding:4px 12px;border-radius:0 9px 9px 0;width:max-content}
.bl.c>.lista{border-left:16px solid var(--b-ctrl);padding:4px 0 4px 6px;min-height:38px}
.bl.c>.pie{height:14px;border-radius:0 0 9px 9px;width:80px}
.bl select{font-family:var(--display);font-weight:800;font-size:15px;border:none;border-radius:999px;padding:1px 6px;background:#fff;color:var(--tinta);cursor:pointer}
.bl .lectura{background:#fff;color:var(--tinta);border-radius:999px;padding:0 9px;font-size:14px}
.paleta .bl{align-self:flex-start;max-width:100%}
.paleta .bl.simple{white-space:normal}
.paleta .bl.c{min-width:0}
.paleta .bl.c>.lista{min-height:16px;padding:2px}
.paleta .bl.c>.pie{width:60px}
.lista:empty::after{content:"";display:block;width:110px;height:26px;border:2px dashed rgba(0,0,0,.18);border-radius:8px}
#raiz:empty::after{display:none}
.bl.oculto{display:none}
.bl.activo.simple,.bl.c.activo>.cab{outline:4px solid var(--sol);outline-offset:1px;filter:brightness(1.12)}
.fantasma{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:rotate(2deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.marca-drop{height:6px;width:130px;border-radius:6px;background:var(--noche);flex:none}
.bloqueado .taller{pointer-events:none}
.bloqueado .taller .zona{opacity:.95}

/* Overlays */
.capa{position:fixed;inset:0;background:rgba(27,20,70,.55);display:grid;place-items:center;z-index:40;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.modal{background:#fff;border-radius:26px;padding:26px;max-width:560px;width:100%;text-align:center;box-shadow:0 8px 0 var(--sombra);max-height:100%;overflow:auto}
.modal h2{font-size:2.1rem;color:var(--violeta)}
.modal .grandes{font-size:3.2rem;letter-spacing:6px;margin:10px 0}
.modal .grandes i{font-style:normal;filter:grayscale(1);opacity:.25}
.modal .acciones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* Diploma */
.diploma{max-width:640px;border:10px solid var(--sol);outline:4px solid var(--violeta);outline-offset:-20px;padding:40px 34px}
.diploma .eti{font-family:var(--marca);color:var(--magenta);letter-spacing:1px;font-size:1rem}
.diploma h2{font-family:var(--marca);font-weight:400;font-size:clamp(1.6rem,5vw,2.3rem);color:var(--noche);margin:6px 0 4px}
.diploma .nombre{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;color:var(--violeta);border-bottom:3px dashed var(--linea);display:inline-block;padding:0 20px;margin:8px 0}
.diploma p{margin:.4em 0;font-size:1.1rem}
.diploma .fecha{color:var(--suave);font-weight:800;font-variant-numeric:tabular-nums}

/* Panel ¿Qué aprendemos? */
.panel{text-align:left;max-width:640px}
.panel h2{font-size:1.9rem;margin-bottom:8px}
.panel h3{font-size:1.25rem;margin:14px 0 4px;color:var(--violeta)}
.panel ul{margin:4px 0;padding-left:22px}
.panel p{margin:4px 0}

@media (max-width:1000px){ .misiones{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:900px){ .mision{grid-template-columns:1fr} .misiones{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .inicio{grid-template-columns:1fr;padding:20px} .taller{grid-template-columns:1fr} .paleta{border-right:none;border-bottom:3px solid var(--linea);flex-direction:row;flex-wrap:wrap} .paleta h3{width:100%} }
@media (max-width:460px){ .misiones{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="marca-fila"><div class="marca">SAMUEL DIGITAL<small>Misiones del Robotito</small></div>
      <a class="volver-grado" id="volver-grado" hidden></a></div>
    <div class="quien" id="quien" hidden>
      <span class="chip" id="quien-txt"></span>
      <button id="btn-aprendemos" type="button">📘 ¿Qué aprendemos?</button>
      <button id="btn-salir" type="button">Cambiar de chico/a</button>
    </div>
  </div>
</header>

<main>
  <!-- INICIO -->
  <section id="pant-inicio" class="card inicio">
    <div class="robo-grande" id="robo-grande"></div>
    <form id="form-inicio" autocomplete="off">
      <h1>Misiones del Robotito</h1>
      <p class="lead">Armá programas con bloques y ayudá al robotito a juntar estrellas y llegar a su batería.</p>
      <div class="campo">
        <label for="nombre">¿Cómo te llamás?</label>
        <input id="nombre" maxlength="20" placeholder="Tu nombre" autocomplete="off">
      </div>
      <div class="campo" id="campo-grado">
        <span class="lbl">¿En qué grado estás?</span>
        <div class="grados" id="grados"></div>
      </div>
      <div class="campo" id="campo-grado-fijo" hidden>
        <span class="lbl">Tu grado</span>
        <div class="grado-fijo" id="grado-fijo"></div>
      </div>
      <button class="btn btn-ok" id="btn-empezar" type="submit" disabled>¡Empezar! ▶</button>
    </form>
  </section>

  <!-- MAPA -->
  <section id="pant-mapa" hidden>
    <div class="mapa-cab">
      <div>
        <h2 id="mapa-tit"></h2>
        <p id="mapa-sub"></p>
      </div>
      <div class="total" id="mapa-total"></div>
    </div>
    <div class="misiones" id="misiones"></div>
    <div class="mapa-pie" id="mapa-pie"></div>
  </section>

  <!-- MISIÓN -->
  <section id="pant-mision" hidden>
    <div class="mision" id="mision">
      <div class="lado">
        <div class="card consigna">
          <span class="eti" id="m-eti"></span>
          <h2 id="m-tit"></h2>
          <p id="m-txt"></p>
          <div class="chips" id="m-chips"></div>
        </div>
        <div class="card escena">
          <div class="globo" id="globo"><div class="cara" id="cara"></div><div class="txt" id="globo-txt"></div></div>
          <div class="tablero-wrap" id="tablero-wrap"><div class="tablero" id="tablero"></div></div>
          <div class="controles">
            <button class="btn btn-ok" id="btn-ejecutar" type="button">▶ Ejecutar</button>
            <button class="btn btn-mal" id="btn-detener" type="button" hidden>⏹ Detener</button>
            <button class="btn btn-blanco" id="btn-reiniciar" type="button">↺ Volver a empezar</button>
            <button class="btn btn-blanco" id="btn-otro" type="button" hidden>🎲 Otro tablero</button>
            <button class="btn btn-blanco" id="btn-mapa" type="button">🗺 Misiones</button>
          </div>
        </div>
      </div>
      <div class="lado">
        <div class="card taller">
          <div class="paleta" id="paleta"></div>
          <div class="zona" id="zona">
            <div class="zona-cab">
              <h3>Mi programa</h3>
              <span class="cuenta" id="cuenta"></span>
              <button class="borrar-todo" id="btn-borrar" type="button">🗑 Borrar todo</button>
            </div>
            <div class="programa" id="programa">
              <div class="hat">al tocar <span>▶ Ejecutar</span></div>
              <div class="lista" id="raiz" data-owner="raiz" data-key="body"></div>
              <p class="vacio-ayuda" id="vacio-ayuda">Arrastrá bloques hasta acá, o tocá un bloque para sumarlo al final.</p>
              <div id="def-zona" hidden>
                <div class="hat def">definir <b id="def-nombre"></b></div>
                <div class="lista" id="def-lista" data-owner="proc" data-key="body"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="capa" id="capa" hidden><div class="modal" id="modal"></div></div>

<script>
/* ============ Dibujos ============ */
// Robotito visto de frente + flecha amarilla que indica hacia dónde mira.
const FLECHA = {

/* ============ Misiones ============
   Mapas: R robotito · B batería · * estrella · # roca · . pasto
   gen(): el tablero cambia cada vez (6°), así hace falta que el robotito decida.
   optimo: cantidad de bloques de la solución más corta que conocemos → ⭐⭐⭐ */
const azar = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
const vacio = (w,h,c='.')=> Array.from({length:h},()=>Array(w).fill(c));
const texto = g => g.map(f=>f.join(''));

// Escalera: el robotito sube un escalón por paso; abajo de la escalera, rocas.
function escalera(n, estrellas){
  const g=vacio(n+1,n+1); const h=n;
  for(let x=0;x<=n;x++) for(let y=0;y<=n;y++) if(y > h+1-x && x>=2) g[y][x]='#';
  g[h][0]='R';
  if(estrellas) for(let k=1;k<=n;k++) g[h-k][k]='*'; else g[0][n]='B';
  return texto(g);
}
// Pasillo con curvas: solo se puede caminar por el camino; todo lo demás es roca.
function pasilloCurvas(conEstrellas){
  const W=9,H=7; let g, camino;
  do{
    g=vacio(W,H,'#'); camino=[];
    let x=0, y=azar(1,5); camino.push([x,y]);
    let primera=true;
    while(x<W-1){
      const largo=Math.min(primera?azar(2,3):azar(2,3), W-1-x); primera=false;
      for(let i=0;i<largo;i++){ x++; camino.push([x,y]); }
      if(x>=W-1) break;
      const opciones=[]; for(const d of [-1,1]) for(const l of [2,3]){ const ny=y+d*l; if(ny>=0&&ny<H) opciones.push([d,l]); }
      const [d,l]=opciones[azar(0,opciones.length-1)];
      for(let i=0;i<l;i++){ y+=d; camino.push([x,y]); }
    }
  }while(camino.length<12);
  camino.forEach(([x,y])=>g[y][x]='.');
  const [x0,y0]=camino[0], [xf,yf]=camino[camino.length-1];
  g[y0][x0]='R'; g[yf][xf]='B';
  if(conEstrellas){
    const medio=camino.slice(1,-1); let c;
    do{ c=medio.filter(()=>Math.random()<.3); }while(c.length<2);
    c.forEach(([x,y])=>g[y][x]='*');
  }
  return texto(g);
}
// Fila con rocas al azar (separadas para poder saltarlas) y batería al final.
function filaRocas(estrellasAbajo, estrellasArriba){
  let rocas;
  do{ rocas=[]; let x=1; while(x<=7){ if(Math.random()<.45){ rocas.push(x); x+=2; } else x++; } }while(rocas.length<2 || rocas.length>3);
  const g=vacio(9,2); g[1][0]='R'; g[1][8]='B'; rocas.forEach(x=>g[1][x]='#');
  if(estrellasAbajo){ let c; do{ c=[]; for(let x=1;x<=7;x++) if(!rocas.includes(x)&&Math.random()<.35) c.push(x); }while(!c.length); c.forEach(x=>g[1][x]='*'); }
  if(estrellasArriba){ let c; do{ c=rocas.filter(()=>Math.random()<.6); }while(!c.length); c.forEach(x=>g[0][x]='*'); }
  return texto(g);
}
// Plaza: un camino alrededor de un rectángulo de rocas, con estrellas al azar.
function plaza(){
  const w=azar(6,9), h=azar(4,7), g=vacio(9,7,'#');
  const anillo=[];
  for(let x=0;x<w;x++) anillo.push([x,0]);
  for(let y=1;y<h;y++) anillo.push([w-1,y]);
  for(let x=w-2;x>=0;x--) anillo.push([x,h-1]);
  for(let y=h-2;y>=1;y--) anillo.push([0,y]);
  anillo.forEach(([x,y])=>g[y][x]='.');
  g[0][0]='R'; g[1][0]='B';
  let c; do{ c=anillo.slice(1,-1).filter(()=>Math.random()<.25); }while(c.length<3);
  c.forEach(([x,y])=>g[y][x]='*');
  return texto(g);
}

/* ============ Intérprete ============ */
function estadoInicial(mapa, dir){
  const st={w:mapa[0].length,h:mapa.length,x:0,y:0,dir:dir||'der',estrellas:new Set(),rocas:new Set(),bat:null,juntadas:0,pasos:0,fin:null,proc:[]};
  mapa.forEach((f,y)=>[...f].forEach((c,x)=>{
    if(c==='R'){st.x=x;st.y=y}
    else if(c==='*') st.estrellas.add(x+','+y);
    else if(c==='#') st.rocas.add(x+','+y);
    else if(c==='B') st.bat=[x,y];
  }));
  return st;
}
function libre(st,x,y){ return x>=0&&y>=0&&x<st.w&&y<st.h&&!st.rocas.has(x+','+y); }
function cumple(c, st){
  const [dx,dy]=DIRV[st.dir];
  if(c==='estrella') return st.estrellas.has(st.x+','+st.y);
  if(c==='pared') return !libre(st, st.x+dx, st.y+dy);
  if(c==='caminoIzq'){ const [a,b]=DIRV[GIRO_IZQ[st.dir]]; return libre(st, st.x+a, st.y+b); }
  if(c==='caminoDer'){ const [a,b]=DIRV[GIRO_DER[st.dir]]; return libre(st, st.x+a, st.y+b); }
  if(c==='bateria') return !!st.bat && st.x===st.bat[0] && st.y===st.bat[1];
  return false;
}
const MAX_PASOS = 1500;
function* mover(b, st, dir){
  const [dx,dy]=DIRV[dir], nx=st.x+dx, ny=st.y+dy; st.dir=dir;
  if(nx<0||ny<0||nx>=st.w||ny>=st.h){ st.fin='borde'; st.choque=[nx,ny]; yield {id:b.id,k:'choque'}; return; }
  if(st.rocas.has(nx+','+ny)){ st.fin='roca'; st.choque=[nx,ny]; yield {id:b.id,k:'choque'}; return; }
  st.x=nx; st.y=ny; yield {id:b.id,k:'mover'};
}
function* correr(lista, st, prof=0){
  for(const b of lista){
    if(st.fin) return;
    if(++st.pasos > MAX_PASOS){ st.fin='vueltas'; return; }
    if(b.t in DIRV) yield* mover(b, st, b.t);
    else if(b.t==='av') yield* mover(b, st, st.dir);
    else if(b.t==='gi'){ st.dir=GIRO_IZQ[st.dir]; yield {id:b.id,k:'girar'}; }
    else if(b.t==='gd'){ st.dir=GIRO_DER[st.dir]; yield {id:b.id,k:'girar'}; }
    else if(b.t==='juntar'){
      const k=st.x+','+st.y;
      if(!st.estrellas.has(k)){ st.fin='nada'; yield {id:b.id,k:'nada'}; return; }
      st.estrellas.delete(k); st.juntadas++; yield {id:b.id,k:'juntar',pos:k};
    } else if(b.t==='pr'){
      if(prof>20){ st.fin='vueltas'; return; }
      yield {id:b.id,k:'ctrl'}; yield* correr(st.proc, st, prof+1);
    } else if(b.t==='rep'){
      for(let i=0;i<b.n;i++){ yield {id:b.id,k:'ctrl'}; yield* correr(b.body,st,prof); if(st.fin) return; }
    } else if(b.t==='si'){
      yield {id:b.id,k:'ctrl'}; if(cumple(b.c,st)) yield* correr(b.body,st,prof);
    } else if(b.t==='sisino'){
      yield {id:b.id,k:'ctrl'}; yield* correr(cumple(b.c,st)?b.body:b.otro,st,prof);
    } else if(b.t==='hasta'){
      while(!cumple(b.c,st)){
        if(++st.pasos > MAX_PASOS){ st.fin='vueltas'; return; }
        yield {id:b.id,k:'ctrl'}; yield* correr(b.body,st,prof); if(st.fin) return;
      }
    }
  }
}
function evaluar(st){
  if(st.fin) return {ok:false, motivo:st.fin};
  if(st.estrellas.size) return {ok:false, motivo:'faltan'};
  if(st.bat && !(st.x===st.bat[0] && st.y===st.bat[1])) return {ok:false, motivo:'nollego'};
  return {ok:true};
}
function inicioDe(mapa, m){ const st=estadoInicial(mapa, m.dir); if(m.inicioEstrella) st.estrellas.add(st.x+','+st.y); return st; }
function simular(mapa, prog, proc, m){ const st=inicioDe(mapa, m||{}); st.proc=proc||[]; for(const _ of correr(prog,st)); return evaluar(st); }

  faltan:'Me faltaron estrellas por juntar.',

};

}
function htmlBloque(b, enPaleta){

function buscarEn(id, lista){
  for(const b of lista){ if(b.id===id) return b; for(const k of ['body','otro']) if(b[k]){ const r=buscarEn(id,b[k]); if(r) return r; } }
  return null;
}

function quitarEn(id, lista){
  const i=lista.findIndex(b=>b.id===id); if(i>=0) return lista.splice(i,1)[0];
  for(const b of lista) for(const k of ['body','otro']) if(b[k]){ const r=quitarEn(id,b[k]); if(r) return r; }
  return null;
}

/* --- Arrastrar y soltar --- */
let drag=null;
document.addEventListener('pointerdown', e=>{
  if(corriendo || e.button>0) return;
  const el=e.target.closest('.bl'); if(!el || e.target.closest('select')) return;
  if(!el.closest('#paleta') && !el.closest('#programa')) return;
  e.preventDefault();
  drag={el, desde: el.closest('#paleta')?'paleta':'programa', t:el.dataset.t, id:el.dataset.id, x0:e.clientX, y0:e.clientY, activo:false};
});
document.addEventListener('pointermove', e=>{
  if(!drag) return;
  if(!drag.activo){
    if(Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) < 6) return;
    drag.activo=true;
    const r=drag.el.getBoundingClientRect();
    drag.dx=drag.x0-r.left; drag.dy=drag.y0-r.top;
    drag.fant=drag.el.cloneNode(true); drag.fant.classList.add('fantasma'); drag.fant.style.width=r.width+'px';
    document.body.append(drag.fant);
    if(drag.desde==='programa'){ drag.el.classList.add('oculto'); $('paleta').classList.add('borrar'); }
    drag.marca=document.createElement('div'); drag.marca.className='marca-drop';
  }
  drag.fant.style.left=(e.clientX-drag.dx)+'px'; drag.fant.style.top=(e.clientY-drag.dy)+'px';
  ubicar(e.clientX, e.clientY);
});
function ubicar(x,y){
  const debajo=document.elementFromPoint(x,y);
  let lista = debajo && debajo.closest('#programa .lista');
  if(!lista && debajo && debajo.closest('#def-zona')) lista=$('def-lista');
  if(!lista && debajo && debajo.closest('#zona')) lista=$('raiz');
  drag.destino=null; drag.marca.remove();
  if(!lista) return;
  const hijos=[...lista.children].filter(c=>c.classList.contains('bl') && !c.classList.contains('oculto'));
  let idx=hijos.findIndex(c=>{ const r=c.getBoundingClientRect(); return y < r.top + Math.min(r.height/2, 24); });
  if(idx<0) idx=hijos.length;
  drag.destino={lista, idx};
  if(idx<hijos.length) lista.insertBefore(drag.marca, hijos[idx]); else lista.append(drag.marca);
}
document.addEventListener('pointerup', e=>{
  if(!drag) return;
  const d=drag; drag=null;
  $('paleta').classList.remove('borrar');
  if(!d.activo){
    if(d.desde==='paleta'){ programa.push(nuevoBloque(d.t)); renderPrograma(); }
    return;
  }
  d.fant.remove(); d.marca.remove();
  let b = d.desde==='programa' ? quitar(d.id) : nuevoBloque(d.t);
  if(d.destino && b){ listaDe(d.destino.lista).splice(d.destino.idx, 0, b); }
  renderPrograma();
});
document.addEventListener('pointercancel', ()=>{ if(!drag) return; if(drag.fant) drag.fant.remove(); if(drag.marca) drag.marca.remove(); drag=null; $('paleta').classList.remove('borrar'); renderPrograma(); });

async function ejecutar(){
  if(corriendo) return;
  if(!programa.length){ decir('Todavía no hay bloques en el programa. ¡Arrastrá alguno!', 'mal'); return; }
  // Siempre se ejecuta sobre el tablero que el chico está viendo.
  dibujarTablero(mapaActual);
  await pausa(250);
  setCorriendo(true); detener=false;
  decir('¡Allá voy!');
  const st=inicio(mapaActual); st.proc=procBody;
  for(const ev of correr(programa, st)){
    if(detener) break;
    marcarActivo(ev.id);
    if(ev.k==='mover'){ ponerRobot(st.x, st.y, st.dir); await pausa(380); }
    else if(ev.k==='girar'){ ponerRobot(st.x, st.y, st.dir); await pausa(300); }
    else if(ev.k==='juntar'){ const it=document.querySelector(`#tablero .item[data-k="${ev.pos}"]`); if(it) it.classList.add('juntada'); await pausa(360); }
    else if(ev.k==='choque'){
      ponerRobot(st.x, st.y, st.dir);
      robotEl.classList.add('choca');
      const p=document.createElement('div'); p.className='pum'; p.textContent='💥';
      p.style.left=(((st.x+st.choque[0])/2)*celda + celda*.2)+'px'; p.style.top=(((st.y+st.choque[1])/2)*celda + celda*.1)+'px';
      $('tablero').append(p); await pausa(600);
    }
    else if(ev.k==='nada'){ robotEl.classList.add('choca'); await pausa(500); }
    else await pausa(120);
  }
  marcarActivo(null);
  setCorriendo(false);
  if(detener){ decir('Me frenaste. Cuando quieras, tocá Ejecutar de nuevo.'); return; }
  const r=evaluar(st);
  if(!r.ok){
    fallos++;
    let txt = MOTIVOS[r.motivo] + ' Tocá "Volver a empezar" y corregí el programa.';
    if(fallos>=3) txt += ' 💡 Pista: ' + mision.pista;
    decir(txt, 'mal');
    return;
  }
  // Misiones al azar: el programa tiene que funcionar en cualquier tablero, no solo en este.
  if(mision.gen){
    let otro=null;
    for(let i=0;i<80 && !otro;i++){ const m=mision.gen(); if(!probar(m).ok) otro=m; }
    if(otro){
      fallos++;
      await pausa(900);
      mapaActual=otro; dibujarTablero(mapaActual);
      let txt='¡En ese tablero funcionó! 🎲 Pero los tableros cambian, y encontré este otro donde tu programa falla. Tocá Ejecutar para verlo.';
      if(fallos>=3) txt += ' 💡 Pista: ' + mision.pista;
      decir(txt, 'mal');
      return;
    }
  }
  ganar();
}

function ganar(){
  const n = totalBloques(), est = n <= mision.optimo ? 3 : 2;
  progreso.estrellas[mIdx] = Math.max(progreso.estrellas[mIdx], est); guardarProgreso();
  registrar({nombre:alumno.nombre, grado:alumno.grado, actividad:'Misiones del Robotito', mision:mIdx+1, estrellas:est, bloques:n});
  decir('¡Lo logramos! 🎉', 'bien');
  const ultima = mIdx===N_MIS-1, todas = progreso.estrellas.every(x=>x>0);
  const msj = est===3 ? `¡Solución perfecta con ${n} bloques! Sos un/a crack de la programación.`
    : `¡Lo lograste con ${n} bloques! Pero se puede hacer con ${mision.optimo} o menos. ¿Te animás a buscar la 3° estrella?`;
  abrirModal(`<h2>¡Misión cumplida!</h2>
    <div class="grandes">${estrellasHtml(est)}</div>
    <p>${msj}</p>
    <div class="acciones">
      ${est<3 ? '<button class="btn btn-sol" data-a="mejorar" type="button">⭐ Buscar la 3° estrella</button>' : ''}
      ${ultima && todas ? '<button class="btn btn-sol" data-a="diploma" type="button">🎓 Ver mi diploma</button>'
        : !ultima ? '<button class="btn btn-ok" data-a="sig" type="button">Siguiente misión ▶</button>' : ''}
      <button class="btn btn-blanco" data-a="mapa" type="button">🗺 Misiones</button>
    </div>`);
}

/* ============ Modales ============ */
function abrirModal(html, clase){ $('modal').className='modal'+(clase?' '+clase:''); $('modal').innerHTML=html; $('capa').hidden=false; const b=$('modal').querySelector('button'); if(b) b.focus(); }
function cerrarModal(){ $('capa').hidden=true; }
$('capa').addEventListener('click', e=>{
  const a=e.target.closest('[data-a]')?.dataset.a;
  if(e.target===$('capa') || a==='cerrar') return cerrarModal();
  if(!a) return;
  cerrarModal();
  if(a==='sig') abrirMision(mIdx+1);
  if(a==='mejorar'){ fallos=0; dibujarTablero(mapaActual); decir('¡Vamos por la 3° estrella! Buscá cómo usar menos bloques.'); }
  if(a==='mapa') irMapa();
  if(a==='diploma') verDiploma();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('capa').hidden) cerrarModal(); });

function verDiploma(){
  const G=GRADOS[alumno.grado], tot=progreso.estrellas.reduce((a,b)=>a+b,0);
  const f=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  abrirModal(`<div class="eti">SAMUEL DIGITAL</div>
    <h2>Diploma de Programación</h2>
    <p>Este diploma es para</p>
    <div class="nombre">${esc(alumno.nombre)}</div>
    <p>por completar las ${N_MIS} <b>Misiones del Robotito</b> de ${G.nombre}: <b>${G.tema}</b>.</p>
    <p style="font-size:2rem;margin:10px 0">⭐ ${tot} de ${N_MIS*3}</p>
    <p class="fecha">${f}</p>
    <div class="acciones"><button class="btn btn-blanco" data-a="mapa" type="button">🗺 Volver a las misiones</button></div>`, 'diploma');
}

$('btn-aprendemos').onclick = ()=>{
  abrirModal(`<div class="panel">
    <h2>📘 ¿Qué aprendemos?</h2>
    <h3>Lo que vas a lograr</h3>
    <ul><li><b>3°:</b> usar flechas para dar órdenes, juntar estrellas y conocer el bloque "repetir".</li>
      <li><b>4°:</b> dar órdenes en el orden correcto y encontrar el camino más corto.</li>
      <li><b>5°:</b> pensar hacia dónde mira el robotito y usar "repetir", incluso uno adentro de otro.</li>
      <li><b>6°:</b> hacer que el robotito decida solo con "si… entonces" e inventar tus propios bloques.</li></ul>
    <h3>Palabras nuevas</h3>
    <ul><li><b>Algoritmo:</b> los pasos ordenados para resolver un problema.</li>
      <li><b>Bucle:</b> un pedazo del programa que se repite.</li>
      <li><b>Condición:</b> una pregunta que se responde con sí o no, como "¿hay pared adelante?".</li>
      <li><b>Bloque propio (función):</b> un grupo de órdenes con nombre, que usás cuantas veces quieras.</li>
      <li><b>Bug:</b> un error en el programa. ¡Encontrarlo y arreglarlo es parte de programar!</li></ul>
    <h3>¿Sabías que…?</h3>
    <p>Los robots que andan en Marte siguen programas parecidos a estos: "avanzá; si hay una roca, esquivala".</p>
    <h3>Para charlar en familia</h3>
    <p>¿Qué cosas de todos los días hacemos "repitiendo"? ¿Y qué decisiones tomamos con un "si…"? (Si llueve, llevo paraguas.)</p>
    <h3>Para jugar en casa</h3>
    <p>Uno es el robotito y otro le da órdenes: "avanzá 2, girá a la derecha, juntá la media". ¡Gana si llega a la meta sin chocar!</p>
    <div class="acciones"><button class="btn btn-ok" data-a="cerrar" type="button">¡Entendido!</button></div>
  </div>`);
};

/* Para pruebas */
window.__robotito = {GRADOS, simular, estadoInicial, DIRV, GIRO_IZQ, GIRO_DER,
  prueba:{ velocidad:v=>{VEL=v}, cargar:(p,pr)=>{ programa=p; procBody=pr||[]; renderPrograma(); }, estado:()=>({programa,procBody,mapaActual,fallos}), ejecutar:()=>ejecutar() }};
</script>
